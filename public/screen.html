<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23a31212%27/%3E%3Ctext x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-size=%2756%27 fill=%27%23ffd700%27 font-family=%27serif%27 font-weight=%27bold%27%3E%E5%A5%96%3C/text%3E%3C/svg%3E">
<title>幸运抽奖 · 大屏</title>
<link rel="stylesheet" href="/css/base.css?v=10">
<link rel="stylesheet" href="/css/screen.css?v=10">
</head>
<body>
<div id="stage">

  <svg class="lantern l big" viewBox="0 0 100 165" aria-hidden="true">
    <defs><radialGradient id="lgl" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#ff6b5e"/><stop offset="0.55" stop-color="#e01f1f"/><stop offset="1" stop-color="#9e0d0d"/>
    </radialGradient></defs>
    <line x1="50" y1="0" x2="50" y2="22" stroke="#ffd700" stroke-width="3"/>
    <rect x="34" y="20" width="32" height="10" rx="4" fill="#ffd700"/>
    <ellipse cx="50" cy="80" rx="43" ry="46" fill="url(#lgl)"/>
    <path d="M22 66 q28 -16 56 0 M20 96 q30 -14 60 0" stroke="#ffd700" stroke-opacity="0.45" fill="none" stroke-width="2"/>
    <text x="50" y="93" text-anchor="middle" font-size="42" fill="#ffd700" font-weight="bold" font-family="KaiTi,STKaiti,serif">福</text>
    <rect x="37" y="122" width="26" height="8" rx="4" fill="#ffd700"/>
    <line x1="50" y1="130" x2="50" y2="158" stroke="#ffd700" stroke-width="3"/>
    <line x1="42" y1="130" x2="42" y2="150" stroke="#ffd700" stroke-width="2"/>
    <line x1="58" y1="130" x2="58" y2="150" stroke="#ffd700" stroke-width="2"/>
  </svg>
  <svg class="lantern r big" viewBox="0 0 100 165" aria-hidden="true">
    <defs><radialGradient id="lgr" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#ff6b5e"/><stop offset="0.55" stop-color="#e01f1f"/><stop offset="1" stop-color="#9e0d0d"/>
    </radialGradient></defs>
    <line x1="50" y1="0" x2="50" y2="22" stroke="#ffd700" stroke-width="3"/>
    <rect x="34" y="20" width="32" height="10" rx="4" fill="#ffd700"/>
    <ellipse cx="50" cy="80" rx="43" ry="46" fill="url(#lgr)"/>
    <path d="M22 66 q28 -16 56 0 M20 96 q30 -14 60 0" stroke="#ffd700" stroke-opacity="0.45" fill="none" stroke-width="2"/>
    <text x="50" y="93" text-anchor="middle" font-size="42" fill="#ffd700" font-weight="bold" font-family="KaiTi,STKaiti,serif">运</text>
    <rect x="37" y="122" width="26" height="8" rx="4" fill="#ffd700"/>
    <line x1="50" y1="130" x2="50" y2="158" stroke="#ffd700" stroke-width="3"/>
    <line x1="42" y1="130" x2="42" y2="150" stroke="#ffd700" stroke-width="2"/>
    <line x1="58" y1="130" x2="58" y2="150" stroke="#ffd700" stroke-width="2"/>
  </svg>

  <header>
    <h1 id="act-title" class="gold-text">年度盛典 · 幸运抽奖</h1>
    <p id="act-subtitle"></p>
  </header>

  <!-- 主舞台 -->
  <main id="main-stage" data-phase="idle">
    <!-- 3D 头像星球（签到墙风格：球面分布 + 景深旋转，双星球对转） -->
    <div id="sphere-stage">
      <div id="sphere-halo"></div>
      <div id="sphere2"></div>
      <div id="sphere"></div>
    </div>

    <!-- 中央聚光区 -->
    <div id="center-stage">
      <!-- idle：扫码 -->
      <div id="c-qr" class="center-box">
        <img id="qr-img" alt="签到二维码">
        <div class="qr-tip">微信扫码 · 参与抽奖</div>
        <div class="sign-counter">参与人数 <b id="sign-count">0</b> 人</div>
      </div>
      <!-- ready：奖品信息 -->
      <div id="c-prize" class="center-box hidden">
        <div class="prize-label" id="prize-round">第1轮</div>
        <img id="prize-img" class="prize-img hidden" alt="">
        <div class="prize-name gold-text" id="prize-name">幸运大奖</div>
        <div class="prize-count" id="prize-count">名额 1 人</div>
        <div class="prize-ready-tip" id="prize-tip">准备开奖…</div>
      </div>
      <!-- rolling：快速滚动头像 -->
      <div id="c-roll" class="center-box hidden">
        <img id="roll-avatar" class="avatar" alt="">
        <div class="roll-name" id="roll-name">???</div>
      </div>
      <!-- reveal：中奖者 -->
      <div id="c-reveal" class="center-box hidden"></div>
    </div>

    <!-- 揭晓后的名单面板（舞台下方） -->
    <div id="reveal-board" class="hidden">
      <div class="rb-title" id="rb-title">🎉 本轮幸运名单</div>
      <div class="rb-grid" id="rb-grid"></div>
    </div>
  </main>

  <!-- 底部信息带 -->
  <footer>
    <div class="foot-left">
      <span class="stat">参与人数 <b id="stat-signed">0</b> 人</span>
      <span class="stat">已产生 <b id="stat-won">0</b> 位幸运儿</span>
    </div>
    <div class="foot-ticker" id="ticker"><div class="ticker-inner" id="ticker-inner">静候开奖，祝大家好运连连 🧧</div></div>

    <!-- 开奖控制条：主持人在大屏上直接开奖（首次使用需输入管理密钥） -->
    <div id="ctl-dock">
      <button id="ck-prev" class="dock-btn" title="上一轮 (←)">‹</button>
      <div id="ck-round-label" class="dock-round">未选轮次</div>
      <button id="ck-next" class="dock-btn" title="下一轮 (→)">›</button>
      <button id="ck-primary" class="dock-primary" title="空格键">开始抽奖</button>
      <button id="ck-idle" class="dock-btn" title="返回签到页">↩</button>
      <span id="ck-lock" class="dock-lock" title="管理密钥状态">🔓</span>
    </div>
  </footer>

  <!-- 控制按钮 -->
  <div class="screen-ctl">
    <button id="btn-full" class="ctl-btn" title="全屏 (F)">⛶</button>
    <button id="btn-sound" class="ctl-btn" title="音效 (M)">🔊</button>
  </div>

  <!-- 揭晓闪光层 -->
  <div id="flash-layer"></div>

  <!-- 3·2·1 倒计时层 -->
  <div id="countdown" class="hidden"></div>

  <!-- 管理密钥弹层 -->
  <div id="key-modal" class="dock-key-modal hidden">
    <div class="card key-card">
      <h3>🔑 开奖授权</h3>
      <p>输入管理密钥（.env 中 ADMIN_KEY）</p>
      <input id="ck-key" type="password" placeholder="管理密钥" autocomplete="off">
      <button id="ck-key-ok" class="btn">确认</button>
    </div>
  </div>
</div>

<script src="/js/http.js?v=10"></script>
<script src="/js/confetti.js?v=10"></script>
<script src="/js/screen.js?v=10"></script>
</body>
</html>
