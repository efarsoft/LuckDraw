<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b3d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23101b3d%27/%3E%3Ctext x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-size=%2748%27 fill=%27%23ffd700%27 font-family=%27serif%27 font-weight=%27bold%27%3E%E5%85%A5%3C/text%3E%3C/svg%3E">
<title>入场签到</title>
<link rel="stylesheet" href="/css/base.css?v=20">
<style>
/* ===== 入场签到：藏蓝"入场券"风（与抽奖页明确区分） ===== */
body {
  background: linear-gradient(168deg, #0a1230 0%, #14204d 55%, #1b2a66 100%) fixed;
  color: #eef2ff;
  font-family: var(--font-cn);
}
body::before { opacity: .5; }
.page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 34px 20px 44px; }

header { text-align: center; padding: 14px 0 4px; }
header h1 { font-size: 26px; font-weight: 900; color: #ffd76a; letter-spacing: .18em; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
header p { margin-top: 8px; color: rgba(238,242,255,.55); font-size: 12px; letter-spacing: .35em; }

/* 入场券卡片 */
.ticket {
  position: relative;
  margin-top: 22px;
  background: linear-gradient(160deg, #16224f, #0d1636);
  border: 1px solid rgba(255, 215, 106, .4);
  border-radius: 18px;
  box-shadow: 0 14px 44px rgba(0, 0, 0, .5);
  overflow: hidden;
}
.ticket::before, .ticket::after { /* 券两侧缺口 */
  content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
  background: #0a1230; border: 1px solid rgba(255,215,106,.4);
}
.ticket::before { left: -12px; top: calc(88px - 11px); }
.ticket::after { right: -12px; top: calc(88px - 11px); }
.tk-head {
  padding: 20px 22px 14px;
  display: flex; align-items: center; gap: 14px;
  border-bottom: 2px dashed rgba(255, 215, 106, .45);
}
.tk-badge {
  width: 46px; height: 46px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: rgba(255, 215, 106, .14); border: 1px solid rgba(255, 215, 106, .5);
}
.tk-title { font-size: 20px; font-weight: 900; color: #ffd76a; letter-spacing: .1em; }
.tk-sub { font-size: 12px; color: rgba(238,242,255,.6); margin-top: 3px; }
.tk-body { padding: 18px 22px 22px; }
.tk-tip { font-size: 12.5px; color: rgba(238,242,255,.72); line-height: 1.8; margin-bottom: 16px; }
.tk-tip b { color: #ffd76a; }

.f { margin-bottom: 14px; }
.f label { display: block; font-size: 13px; color: rgba(238,242,255,.65); margin-bottom: 7px; letter-spacing: .08em; }
.f label b { color: #ff9b9b; margin-left: 2px; }
.f input {
  width: 100%; box-sizing: border-box; padding: 13px 14px;
  border-radius: 10px; border: 1px solid rgba(255, 215, 106, .3);
  background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 16px; outline: none;
}
.f input:focus { border-color: rgba(255, 215, 106, .8); }
.btn-submit {
  width: 100%; margin-top: 6px; padding: 14px; border: none; border-radius: 11px;
  font-family: var(--font-cn); font-size: 16px; font-weight: 800; letter-spacing: .2em;
  cursor: pointer;
  background: linear-gradient(135deg, #ffd76a, #f5a623); color: #14204d;
  box-shadow: 0 6px 18px rgba(245, 166, 35, .35);
}
.btn-submit:disabled { opacity: .5; }
.err { color: #ff9b9b; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }

/* 完成态：整券变入场凭证 */
.tk-done { text-align: center; padding: 30px 22px 28px; }
.tk-done .big { font-size: 50px; }
.tk-done h2 { font-size: 21px; color: #ffd76a; margin: 12px 0 4px; letter-spacing: .15em; }
.tk-done .who { font-size: 15px; color: rgba(238,242,255,.85); }
.tk-next {
  margin-top: 18px; padding: 13px 14px; border-radius: 12px;
  border: 1px dashed rgba(255, 215, 106, .5); background: rgba(0,0,0,.22);
  font-size: 12.5px; color: rgba(238,242,255,.85); line-height: 1.9;
}
.tk-next b { color: #ffd76a; }
.foot { text-align: center; margin-top: 34px; color: rgba(238,242,255,.35); font-size: 12px; letter-spacing: .2em; }
.avatar { border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,215,106,.6); background: #14204d; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>入场签到</h1>
    <p>EVENT CHECK-IN</p>
  </header>

  <section class="ticket">
    <div class="tk-head" id="tk-head">
      <div class="tk-badge">🎫</div>
      <div>
        <div class="tk-title">入场登记</div>
        <div class="tk-sub" id="tk-wx"></div>
      </div>
      <img id="tk-avatar" class="avatar" width="44" height="44" alt="" style="margin-left:auto">
    </div>

    <div class="tk-body" id="tk-form">
      <div class="tk-tip">请登记以下信息完成入场（仅用于本次活动签到统计）<br>入场<b>不等于参与抽奖</b>——抽奖环节请再扫大屏幕上的二维码</div>
      <div class="f">
        <label>姓名<b>*</b></label>
        <input id="pf-name" maxlength="20" placeholder="请输入真实姓名" autocomplete="name">
      </div>
      <div class="f">
        <label>手机号<b>*</b></label>
        <input id="pf-phone" type="tel" maxlength="11" placeholder="11 位手机号" autocomplete="tel">
      </div>
      <div class="f">
        <label>企业/单位名称（选填）</label>
        <input id="pf-dept" maxlength="40" placeholder="如：××科技有限公司">
      </div>
      <button id="pf-submit" class="btn-submit">完 成 入 场</button>
      <div class="err" id="pf-err"></div>
    </div>

    <div class="tk-done hidden" id="tk-done">
      <div class="big">🎫</div>
      <h2>入场成功</h2>
      <div class="who" id="tk-who"></div>
      <div class="tk-next">🎁 想参与抽奖？<br>开奖环节请扫描<b>大屏幕上的抽奖二维码</b><br>已登记的资料将自动带出，无需重复填写</div>
    </div>
  </section>

  <footer class="foot">祝您参会愉快</footer>
</div>

<script src="/js/http.js?v=20"></script>
<script src="/js/confetti.js?v=20"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  async function boot() {
    let s;
    try {
      const { data } = await http.get('/api/me/state?v=0&wait=1', { retries: 1 });
      s = data;
    } catch (e) {
      if (e.status === 401) return location.replace('/auth/wechat?mode=entry');
      return location.replace('/');
    }
    $('act-title') && ($('act-title').textContent = s.activity.title || '');
    if (s.profile_complete) return showDone(s.me, false);
    if (s.me.avatar) $('tk-avatar').src = s.me.avatar;
    $('tk-wx').textContent = '微信昵称：' + (s.me.wechat_nickname || s.me.nickname || '');
  }

  function showDone(me, celebrate) {
    $('tk-form').classList.add('hidden');
    const name = me.real_name || me.nickname || '';
    $('tk-who').textContent = name ? `${name} · ${me.phone ? me.phone.slice(0,3) + '****' + me.phone.slice(-4) : '已完成登记'}` : '已完成入场登记';
    $('tk-done').classList.remove('hidden');
    if (celebrate) {
      confetti.burst(innerWidth / 2, innerHeight / 2.6, { count: 50, speed: 8, lift: 6 });
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }
  }

  async function submit() {
    const name = $('pf-name').value.trim();
    const phone = $('pf-phone').value.trim();
    const dept = $('pf-dept').value.trim();
    const err = $('pf-err');
    err.textContent = '';
    if (!name) { err.textContent = '请填写姓名'; return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { err.textContent = '手机号格式不正确'; return; }
    $('pf-submit').disabled = true;
    try {
      await http.post('/api/me/profile', { real_name: name, phone, dept });
      const { data } = await http.get('/api/me/state?v=0&wait=1', { retries: 1 });
      showDone({ ...data.me, phone }, true);
    } catch (e) {
      err.textContent = (e && e.message) || '提交失败，请重试';
      $('pf-submit').disabled = false;
    }
  }
  $('pf-submit').onclick = submit;
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  boot();
})();
</script>
</body>
</html>
