<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b3d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23101b3d%27/%3E%3Ctext x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-size=%2748%27 fill=%27%23ffd700%27 font-family=%27serif%27 font-weight=%27bold%27%3E%E5%85%A5%3C/text%3E%3C/svg%3E">
<title>入场签到</title>
<link rel="stylesheet" href="/css/base.css?v=31">
<style>
/* ===== 入场签到：藏蓝"入场券"风（与抽奖页明确区分） ===== */
body {
  background: linear-gradient(168deg, #0a1230 0%, #14204d 55%, #1b2a66 100%) fixed;
  color: #eef2ff;
  font-family: var(--font-cn);
}
body::before { opacity: .5; }
.page { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 30px 18px 44px; }

header { text-align: center; padding: 12px 0 4px; }
header h1 { font-size: 25px; font-weight: 900; color: #ffd76a; letter-spacing: .14em; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
header p { margin-top: 7px; color: rgba(238,242,255,.55); font-size: 12px; letter-spacing: .3em; }

/* ---- 入场券表单 ---- */
.ticket {
  position: relative; margin-top: 20px;
  background: linear-gradient(160deg, #16224f, #0d1636);
  border: 1px solid rgba(255, 215, 106, .4);
  border-radius: 18px;
  box-shadow: 0 14px 44px rgba(0, 0, 0, .5);
  overflow: hidden;
}
.ticket::before, .ticket::after {
  content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
  background: #0a1230; border: 1px solid rgba(255,215,106,.4);
}
.ticket::before { left: -12px; top: 38px; }
.ticket::after { right: -12px; top: 38px; }
.tk-head { padding: 18px 20px 14px; display: flex; align-items: center; gap: 13px; border-bottom: 2px dashed rgba(255, 215, 106, .45); }
.tk-badge { width: 44px; height: 44px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(255, 215, 106, .14); border: 1px solid rgba(255, 215, 106, .5); }
.tk-title { font-size: 19px; font-weight: 900; color: #ffd76a; letter-spacing: .1em; }
.tk-sub { font-size: 12px; color: rgba(238,242,255,.6); margin-top: 3px; }
.tk-body { padding: 16px 20px 20px; }
.tk-tip { font-size: 12.5px; color: rgba(238,242,255,.72); line-height: 1.8; margin-bottom: 14px; }
.tk-tip b { color: #ffd76a; }
.f { margin-bottom: 13px; }
.f label { display: block; font-size: 13px; color: rgba(238,242,255,.65); margin-bottom: 6px; letter-spacing: .08em; }
.f label b { color: #ff9b9b; margin-left: 2px; }
.f input {
  width: 100%; box-sizing: border-box; padding: 12px 14px;
  border-radius: 10px; border: 1px solid rgba(255, 215, 106, .3);
  background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 16px; outline: none;
}
.f input:focus { border-color: rgba(255, 215, 106, .8); }
.btn-submit {
  width: 100%; margin-top: 4px; padding: 13px; border: none; border-radius: 11px;
  font-family: var(--font-cn); font-size: 16px; font-weight: 800; letter-spacing: .2em; cursor: pointer;
  background: linear-gradient(135deg, #ffd76a, #f5a623); color: #14204d;
  box-shadow: 0 6px 18px rgba(245, 166, 35, .35);
}
.btn-submit:disabled { opacity: .5; }
.err { color: #ff9b9b; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
.avatar { border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,215,106,.6); background: #14204d; }

/* ---- 参与状态横幅 ---- */
.pool-banner {
  margin-top: 18px; padding: 16px 18px; border-radius: 16px;
  display: flex; align-items: center; gap: 14px;
  border: 1px solid rgba(255, 215, 106, .45);
  background: linear-gradient(140deg, rgba(255,215,106,.12), rgba(255,255,255,.04));
}
.pool-banner.yes { border-color: rgba(124, 252, 152, .5); background: linear-gradient(140deg, rgba(124,252,152,.12), rgba(255,255,255,.04)); }
.pb-icon { font-size: 34px; }
.pb-state { font-size: 17px; font-weight: 900; color: #ffd76a; }
.pool-banner.yes .pb-state { color: #9fe8a9; }
.pb-sub { font-size: 12px; color: rgba(238,242,255,.72); margin-top: 3px; line-height: 1.6; }
.pb-sub b { color: #ffd76a; }

/* ---- 两步引导 ---- */
.steps {
  margin-top: 12px; padding: 13px 16px; border-radius: 14px;
  border: 1px dashed rgba(255, 215, 106, .4); background: rgba(0,0,0,.2);
  display: flex; gap: 12px; align-items: center; font-size: 12.5px; color: rgba(238,242,255,.85);
}
.steps .s { flex: 1; text-align: center; line-height: 1.7; }
.steps .s b { display: block; font-size: 15px; color: #ffd76a; }
.steps .arrow { color: rgba(255,215,106,.6); font-size: 18px; }

/* ---- 奖品橱窗 ---- */
/* ---- 伴手礼提示 ---- */
.gift-banner {
  margin-top: 14px; padding: 15px 17px; border-radius: 16px;
  display: flex; align-items: center; gap: 14px;
  border: 1.5px dashed rgba(255, 215, 106, .55);
  background: linear-gradient(140deg, rgba(255,215,106,.14), rgba(255,255,255,.03));
}
.gb-icon { font-size: 32px; }
.gb-title { font-size: 15px; font-weight: 900; color: #ffd76a; letter-spacing: .08em; }
.gb-note { font-size: 12.5px; color: rgba(238,242,255,.85); margin-top: 3px; line-height: 1.6; }

.prizes { margin-top: 20px; }
.prizes h2 { font-size: 15px; color: #ffd76a; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.prize-item {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 14px; margin-bottom: 9px; border-radius: 14px;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 215, 106, .22);
}
.prize-item.done { opacity: .55; }
.prize-seq {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #14204d;
  background: linear-gradient(135deg, #ffd76a, #f5a623);
}
.prize-thumb { width: 44px; height: 44px; flex: none; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,215,106,.4); }
.prize-main { flex: 1; min-width: 0; }
.prize-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prize-meta { font-size: 11.5px; color: rgba(238,242,255,.6); margin-top: 3px; }
.prize-state { font-size: 12px; font-weight: 700; flex: none; }
.prize-state.wait { color: rgba(238,242,255,.5); }
.prize-state.live { color: #ffe066; animation: blink 1.3s infinite; }
.prize-state.done { color: #9fe8a9; }
@keyframes blink { 50% { opacity: .35; } }

.foot { text-align: center; margin-top: 32px; color: rgba(238,242,255,.35); font-size: 12px; letter-spacing: .2em; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="act-title">入场签到</h1>
    <p id="act-subtitle"></p>
  </header>

  <!-- 登记 / 完成态 入场券 -->
  <section class="ticket">
    <div class="tk-head">
      <div class="tk-badge">🎫</div>
      <div>
        <div class="tk-title" id="tk-title">入场登记</div>
        <div class="tk-sub" id="tk-sub"></div>
      </div>
      <img id="tk-avatar" class="avatar" width="42" height="42" alt="" style="margin-left:auto">
    </div>

    <div class="tk-body" id="tk-form">
      <div class="tk-tip">请登记以下信息完成入场（仅用于本次活动）<br>入场<b>不等于参与抽奖</b>——抽奖环节请再扫大屏幕上的二维码</div>
      <div class="f"><label>姓名<b>*</b></label><input id="pf-name" maxlength="20" placeholder="请输入真实姓名" autocomplete="name"></div>
      <div class="f"><label>手机号<b>*</b></label><input id="pf-phone" type="tel" maxlength="11" placeholder="11 位手机号" autocomplete="tel"></div>
      <div class="f"><label>企业/单位名称（选填）</label><input id="pf-dept" maxlength="40" placeholder="如：××科技有限公司"></div>
      <button id="pf-submit" class="btn-submit">完 成 入 场</button>
      <div class="err" id="pf-err"></div>
    </div>

    <div class="tk-body hidden" id="tk-done" style="text-align:center">
      <div style="font-size:44px">🎫</div>
      <div style="font-size:20px;font-weight:900;color:#ffd76a;margin-top:8px;letter-spacing:.15em">入场成功</div>
      <div class="tk-sub" id="tk-who" style="margin-top:6px;font-size:13px"></div>
    </div>
  </section>

  <!-- 伴手礼提示（活动结束时领取） -->
  <section id="gift-banner" class="gift-banner hidden">
    <div class="gb-icon">🎁</div>
    <div>
      <div class="gb-title">到场伴手礼</div>
      <div class="gb-note" id="gift-note-text"></div>
    </div>
  </section>

  <!-- 参与状态 + 引导（登记完成后展示，实时刷新） -->
  <section id="pool-panel" class="hidden">
    <div class="pool-banner" id="pool-banner">
      <div class="pb-icon" id="pb-icon">⏳</div>
      <div>
        <div class="pb-state" id="pb-state">未参与抽奖</div>
        <div class="pb-sub" id="pb-sub"></div>
      </div>
    </div>
    <div class="steps" id="steps">
      <div class="s"><b>① 入场登记</b>扫码登记资料<br>✅ 已完成</div>
      <div class="arrow">›</div>
      <div class="s"><b>② 扫码抽奖</b>抽奖环节开始后<br>扫<b style="display:inline;color:#ffd76a">大屏幕二维码</b>参与</div>
    </div>
  </section>

  <!-- 奖品橱窗（实时开奖状态） -->
  <section class="prizes" id="prizes-sec">
    <h2><span>🎁</span> 本场奖品</h2>
    <div id="prizes-list"></div>
  </section>

  <footer class="foot">祝您参会愉快</footer>
</div>

<script src="/js/http.js?v=31"></script>
<script src="/js/confetti.js?v=31"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let version = 0;
  let polling = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render(s) {
    version = s.v;
    $('act-title').textContent = s.activity.title || '入场签到';
    $('act-subtitle').textContent = s.activity.subtitle || '';

    // 伴手礼提示（配置为空则隐藏）
    const gb = $('gift-banner');
    if (s.gift_note) {
      $('gift-note-text').textContent = s.gift_note;
      gb.classList.remove('hidden');
    } else gb.classList.add('hidden');

    if (s.profile_complete) {
      $('tk-form').classList.add('hidden');
      $('tk-done').classList.remove('hidden');
      const name = s.me.real_name || s.me.nickname || '';
      $('tk-who').textContent = name
        ? `${name} · ${s.me.phone ? s.me.phone.slice(0,3) + '****' + s.me.phone.slice(-4) : ''}`
        : '已完成入场登记';
      $('pool-panel').classList.remove('hidden');

      const banner = $('pool-banner');
      if (s.in_pool) {
        banner.classList.add('yes');
        $('pb-icon').textContent = '🎉';
        $('pb-state').textContent = '已参与抽奖';
        $('pb-sub').innerHTML = '已进入奖池，坐等好运降临<br>开奖结果将实时同步到此页面';
        $('steps').classList.add('hidden');
      } else {
        banner.classList.remove('yes');
        $('pb-icon').textContent = '⏳';
        $('pb-state').textContent = '未参与抽奖';
        $('pb-sub').innerHTML = '抽奖环节开始后，请扫描<b>大屏幕上的二维码</b>参与<br>已登记资料自动带出，无需重复填写';
        $('steps').classList.remove('hidden');
      }
    } else if (s.me.avatar) {
      $('tk-avatar').src = s.me.avatar;
    }
    $('tk-sub').textContent = s.me && !s.profile_complete
      ? '微信昵称：' + (s.me.wechat_nickname || s.me.nickname || '')
      : '';

    // 奖品橱窗（含实时状态）
    const box = $('prizes-list');
    box.innerHTML = '';
    const rounds = s.rounds || [];
    if (!rounds.length) {
      box.innerHTML = '<div style="text-align:center;color:rgba(238,242,255,.5);font-size:13px;padding:14px">奖品清单即将公布，敬请期待</div>';
    }
    for (const r of rounds) {
      const el = document.createElement('div');
      const isLive = s.phase === 'rolling' && s.current_round_id === r.id;
      let stateTxt, cls;
      if (r.status === 'drawn') { stateTxt = '已开出'; cls = 'done'; }
      else if (isLive) { stateTxt = '抽奖中'; cls = 'live'; }
      else { stateTxt = '待开'; cls = 'wait'; }
      el.className = 'prize-item' + (r.status === 'drawn' ? ' done' : '');
      el.innerHTML = `
        <div class="prize-seq">${r.seq}</div>
        ${r.prize_image ? `<img class="prize-thumb" src="${esc(r.prize_image)}" onerror="this.remove()" alt="">` : ''}
        <div class="prize-main">
          <div class="prize-name">${esc(r.prize_name)}</div>
          <div class="prize-meta">${esc(r.name)} · 名额 ${r.winner_count} 人</div>
        </div>
        <div class="prize-state ${cls}">${stateTxt}</div>`;
      box.appendChild(el);
    }
  }

  async function poll() {
    if (polling || document.hidden) return;
    polling = true;
    try {
      const { status, data } = await http.get(`/api/me/state?v=${version}&wait=20000`, { retries: 1, timeoutMs: 26000 });
      if (status === 200 && data) render(data);
    } catch (e) {
      if (e.status === 401) { location.replace('/auth/wechat?mode=entry'); return; }
      await new Promise((r) => setTimeout(r, 3000));
    } finally {
      polling = false;
    }
    setTimeout(poll, 500);
  }

  async function submit() {
    const name = $('pf-name').value.trim();
    const phone = $('pf-phone').value.trim();
    const dept = $('pf-dept').value.trim();
    const err = $('pf-err');
    err.textContent = '';
    if (!name) { err.textContent = '请填写姓名'; return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { err.textContent = '手机号格式不正确'; return; }
    $('pf-submit').disabled = true;
    $('pf-submit').textContent = '入场成功，跳转中…';
    try {
      await http.post('/api/me/profile', { real_name: name, phone, dept });
      confetti.burst(innerWidth / 2, innerHeight / 2.6, { count: 50, speed: 8, lift: 6 });
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      // 填完即跳参与页（?from=entry 标记 → 不自动入池，展示奖品清单+未参与提示）
      setTimeout(() => location.replace('/?from=entry'), 1200);
    } catch (e) {
      err.textContent = (e && e.message) || '提交失败，请重试';
      $('pf-submit').disabled = false;
      $('pf-submit').textContent = '完 成 入 场';
    }
  }
  $('pf-submit').onclick = submit;
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('tk-form').classList.contains('hidden')) submit(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

  poll();
})();
</script>
</body>
</html>
