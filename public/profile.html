<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b0606">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23a31212%27/%3E%3Ctext x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-size=%2756%27 fill=%27%23ffd700%27 font-family=%27serif%27 font-weight=%27bold%27%3E%E5%A5%96%3C/text%3E%3C/svg%3E">
<title>抽奖签到 · 幸运抽奖</title>
<link rel="stylesheet" href="/css/base.css?v=38">
<link rel="stylesheet" href="/css/index.css?v=38">
<style>
.page { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 30px 20px 44px; }
.pf-card { margin-top: 10px; padding: 26px 22px; }
.pf-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.pf-head img { width: 56px; height: 56px; }
.pf-wx { font-size: 14px; color: var(--ink-dim); }
.pf-title { font-size: 21px; font-weight: 900; color: var(--gold-1); }
.pf-tip { font-size: 12.5px; color: var(--ink-dim); margin: 6px 0 18px; line-height: 1.7; }
.pf-field { margin-bottom: 14px; }
.pf-field label { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 7px; }
.pf-field label b { color: #ff9b9b; margin-left: 2px; }
.pf-field input {
  width: 100%; box-sizing: border-box; padding: 13px 14px;
  border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.35);
  background: rgba(0, 0, 0, 0.25); color: #fff; font-size: 16px; outline: none;
}
.pf-field input:focus { border-color: rgba(255, 215, 0, 0.75); }
.pf-submit { width: 100%; margin-top: 8px; padding: 14px; font-size: 17px; border-radius: 11px; }
.pf-err { color: #ff9b9b; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
/* 成功态 */
.pf-done { text-align: center; padding: 26px 0 10px; }
.pf-done .big { font-size: 54px; animation: win-pop .6s cubic-bezier(.2,1.6,.4,1); }
.pf-done h2 { font-size: 22px; color: var(--gold-1); margin: 12px 0 6px; }
.pf-done p { font-size: 13px; color: var(--ink-dim); line-height: 1.8; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="act-title" class="gold-text">年度盛典 · 幸运抽奖</h1>
    <p id="act-subtitle"></p>
  </header>

  <section id="pf-form" class="card pf-card">
    <div class="pf-head">
      <img id="pf-avatar" class="avatar" width="56" height="56" alt="">
      <div>
        <div class="pf-title">🎁 抽奖签到</div>
        <div class="pf-wx" id="pf-wx-name"></div>
      </div>
    </div>
    <div class="pf-tip">微信授权成功！完善以下信息即进入奖池，坐等好运降临</div>
    <div class="pf-field">
      <label>姓名<b>*</b></label>
      <input id="pf-name" maxlength="20" placeholder="请输入真实姓名" autocomplete="name">
    </div>
    <div class="pf-field">
      <label>手机号<b>*</b></label>
      <input id="pf-phone" type="tel" maxlength="11" placeholder="11 位手机号" autocomplete="tel">
    </div>
    <div class="pf-field">
      <label>企业/单位名称（选填）</label>
      <input id="pf-dept" maxlength="40" placeholder="如：××科技有限公司">
    </div>
    <button id="pf-submit" class="btn pf-submit">完成签到 · 进入奖池</button>
    <div class="pf-err" id="pf-err"></div>
  </section>

  <section id="pf-done" class="card pf-card pf-done hidden">
    <div class="big">🎊</div>
    <h2>签到成功！</h2>
    <p id="pf-done-name"></p>
    <p>已进入奖池，坐等好运降临<br>开奖结果将实时同步到此微信</p>
  </section>

  <footer class="foot">祝您好运连连 🧧</footer>
</div>

<script src="/js/http.js?v=38"></script>
<script src="/js/confetti.js?v=38"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let me = null;

  async function boot() {
    let s;
    try {
      const { data } = await http.get('/api/me/state?v=0&wait=1', { retries: 1 });
      s = data;
    } catch (e) {
      if (e.status === 401) return location.replace('/auth/wechat');
      return location.replace('/');
    }
    if (!s.profile_required || s.profile_complete) return location.replace('/'); // 无需填写
    me = s.me;
    $('act-title').textContent = s.activity.title || '幸运抽奖';
    $('act-subtitle').textContent = s.activity.subtitle || '';
    const img = $('pf-avatar');
    if (me.avatar) img.src = me.avatar;
    $('pf-wx-name').textContent = '微信昵称：' + (me.wechat_nickname || me.nickname || '');
  }

  async function submit() {
    const name = $('pf-name').value.trim();
    const phone = $('pf-phone').value.trim();
    const dept = $('pf-dept').value.trim();
    const err = $('pf-err');
    err.textContent = '';
    if (!name) { err.textContent = '请填写姓名'; return; }
    if (!/^1[3-9]\d{9}$/.test(phone)) { err.textContent = '手机号格式不正确'; return; }
    $('pf-submit').disabled = true;
    try {
      await http.post('/api/me/profile', { real_name: name, phone, dept });
      $('pf-form').classList.add('hidden');
      $('pf-done-name').textContent = `${name} · ${phone.slice(0,3)}****${phone.slice(-4)}`;
      $('pf-done').classList.remove('hidden');
      confetti.celebrate(2);
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      setTimeout(() => location.replace('/'), 2200);
    } catch (e) {
      err.textContent = (e && e.message) || '提交失败，请重试';
      $('pf-submit').disabled = false;
    }
  }
  $('pf-submit').onclick = submit;
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  boot();
})();
</script>
</body>
</html>
